<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Raspadinha Neon</title>
    <style>
        /* Estilos CSS com Tema Neon */
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap');

        :root {
            --bg-color: #0d0221;
            --surface-color: rgba(255, 255, 255, 0.05);
            --primary-color: #ff00ff; /* Magenta */
            --secondary-color: #00ffff; /* Ciano */
            --green-color: #50ff50; /* Verde Limão */
            --text-color: #f0f0f0;
            --border-color: rgba(0, 255, 255, 0.5);
            --shadow-color-primary: rgba(255, 0, 255, 0.7);
            --shadow-color-secondary: rgba(0, 255, 255, 0.7);
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Orbitron', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            background: linear-gradient(45deg, #0d0221, #24194e, #0d0221);
            background-size: 400% 400%;
            animation: backgroundGradient 15s ease infinite;
            user-select: none;
        }

        @keyframes backgroundGradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .game-container {
            width: 100%;
            max-width: 800px;
            background: var(--surface-color);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
            border: 2px solid var(--border-color);
            box-shadow: 0 0 15px var(--shadow-color-secondary);
            display: flex;
            flex-direction: column;
            gap: 25px;
        }
        
        /* Cabeçalho e Saldo */
        .header { text-align: center; }
        h1 {
            margin: 0;
            font-size: 2.5em;
            color: var(--secondary-color);
            text-shadow: 0 0 5px var(--shadow-color-secondary), 0 0 10px var(--shadow-color-secondary);
        }
        .balance-display {
            padding: 10px 20px;
            border-radius: 10px;
            font-size: 2em;
            font-weight: 700;
            color: var(--green-color);
            margin-top: 10px;
            display: inline-block;
            transition: all 0.3s;
            text-shadow: 0 0 5px #50ff50, 0 0 10px #50ff50;
        }

        /* Controles Gerais e Botões */
        .btn {
            cursor: pointer; border: 2px solid var(--primary-color); border-radius: 8px; font-weight: 700;
            background-color: transparent; color: var(--primary-color);
            transition: all 0.3s ease;
            text-shadow: 0 0 5px var(--shadow-color-primary);
            box-shadow: inset 0 0 10px var(--shadow-color-primary), 0 0 10px var(--shadow-color-primary);
        }
        .btn:hover:not(:disabled) {
            background-color: var(--primary-color);
            color: var(--bg-color);
            box-shadow: 0 0 15px var(--shadow-color-primary), 0 0 25px var(--shadow-color-primary);
        }
        .btn:disabled {
            border-color: #555; color: #555; cursor: not-allowed;
            opacity: 0.7; box-shadow: none; text-shadow: none;
        }
        
        /* Controles de Compra */
        .purchase-controls { display: flex; justify-content: center; align-items: center; gap: 15px; flex-wrap: wrap; }
        .quantity-selector { display: flex; align-items: center; gap: 5px; }
        .quantity-btn { font-size: 1.5em; width: 45px; height: 45px; }
        #quantity-input {
            width: 80px; height: 45px; text-align: center; font-size: 1.2em;
            font-family: 'Orbitron', sans-serif; font-weight: bold;
            border: 2px solid var(--border-color); background-color: rgba(0,0,0,0.3);
            color: var(--text-color); border-radius: 8px;
        }
        .buy-button { font-size: 1em; padding: 12px 22px; min-width: 260px; }
        
        /* Inventário */
        .inventory-wrapper { text-align: center; }
        #reveal-all-btn { border-color: var(--secondary-color); color: var(--secondary-color); text-shadow: 0 0 5px var(--shadow-color-secondary); box-shadow: inset 0 0 10px var(--shadow-color-secondary), 0 0 10px var(--shadow-color-secondary); }
        #reveal-all-btn:hover:not(:disabled) { background-color: var(--secondary-color); color: var(--bg-color); box-shadow: 0 0 15px var(--shadow-color-secondary), 0 0 25px var(--shadow-color-secondary); }
        #inventory-area {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 15px;
            min-height: 140px; background-color: rgba(0,0,0,0.2);
            padding: 20px; border-radius: 10px; margin-top: 15px;
        }
        .inventory-card {
            height: 120px; background: #1a1a2e; border-radius: 10px;
            cursor: pointer; transition: transform 0.3s, box-shadow 0.3s;
            border: 2px solid var(--primary-color);
            box-shadow: 0 0 10px var(--shadow-color-primary);
            position: relative; transform-style: preserve-3d;
        }
        .inventory-card:hover { transform: scale(1.05); box-shadow: 0 0 20px var(--shadow-color-primary); }
        .card-face {
            position: absolute; width: 100%; height: 100%;
            backface-visibility: hidden; -webkit-backface-visibility: hidden;
            border-radius: 8px; display: flex; flex-direction: column; justify-content: center; align-items: center;
        }
        .card-front { font-size: 3em; color: var(--primary-color); text-shadow: 0 0 8px var(--shadow-color-primary); }
        .card-back {
            background: #e0e0e0; transform: rotateY(180deg);
            font-size: 1.5em; font-weight: bold;
        }
        .card-back.win { color: #008000; }
        .card-back.lose { color: #888; }
        .inventory-card.is-revealing { transition: transform 0.6s; transform: rotateY(180deg); }

        /* Área de Depósito */
        .deposit-area {
            border-top: 1px solid var(--border-color); padding-top: 20px;
            text-align: center;
        }
        h3 { margin-top: 0; margin-bottom: 15px; color: var(--secondary-color); text-shadow: 0 0 5px var(--shadow-color-secondary); }
        .deposit-options { display: flex; justify-content: center; align-items: stretch; gap: 10px; flex-wrap: wrap; }
        .deposit-options .btn, .deposit-options input { padding: 10px; height: 45px; }
        #custom-deposit-input { width: 120px; }

        /* Mensagens */
        #message-area { height: 22px; font-size: 1em; color: var(--secondary-color); text-align: center; font-weight: bold; }

        /* Modal (mesma lógica, estilo neon) */
        #scratch-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(13, 2, 33, 0.8); backdrop-filter: blur(5px); display: none; justify-content: center; align-items: center; z-index: 1000; }
        #scratch-modal.visible { display: flex; }
        .modal-content { position: relative; width: 350px; height: 180px; animation: zoomIn 0.3s ease-out; }
        @keyframes zoomIn { from { transform: scale(0.5); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        .scratch-card-container { background-color: #fff; border-radius: 10px; overflow: hidden; }
        #close-modal-btn { position: absolute; top: -40px; right: -20px; background: none; border: none; color: white; font-size: 3em; cursor: pointer; }
        .prize { /* ... estilos internos do prêmio ... */ }

    </style>
</head>
<body>

    <div class="game-container">
        <div class="header">
            <h1>RASPADINHA NEON</h1>
            <div class="balance-display" id="balance-display">Saldo: R$ 1000</div>
        </div>

        <div class="purchase-controls">
            <div class="quantity-selector">
                <button class="btn quantity-btn" id="minus-btn">-</button>
                <input type="number" id="quantity-input" value="1" min="1">
                <button class="btn quantity-btn" id="plus-btn">+</button>
            </div>
            <button class="btn buy-button" id="buy-button">Comprar 1 Raspadinha (R$ 50)</button>
        </div>
        
        <div id="message-area"></div>

        <div class="inventory-wrapper">
            <button class="btn" id="reveal-all-btn" style="display: none;">✨ Revelar Tudo</button>
            <div id="inventory-area"></div>
        </div>

        <div class="deposit-area">
            <h3>Área de Depósito</h3>
            <div class="deposit-options">
                <button class="btn" data-amount="100">+ R$ 100</button>
                <button class="btn" data-amount="500">+ R$ 500</button>
                <button class="btn" data-amount="1000">+ R$ 1000</button>
                <input type="number" id="custom-deposit-input" placeholder="Outro valor">
                <button class="btn" id="custom-deposit-btn">Depositar</button>
            </div>
        </div>
    </div>
    
    <div id="scratch-modal"> </div>

    <script>
    document.addEventListener('DOMContentLoaded', () => {
        // --- CÓDIGO JAVASCRIPT ---
        // (O código JS da versão anterior é inserido aqui, com as adições para depósito)
        const balanceDisplay = document.getElementById('balance-display');
        const quantityInput = document.getElementById('quantity-input');
        const buyButton = document.getElementById('buy-button');
        const minusBtn = document.getElementById('minus-btn');
        const plusBtn = document.getElementById('plus-btn');
        const inventoryArea = document.getElementById('inventory-area');
        const revealAllBtn = document.getElementById('reveal-all-btn');
        const messageArea = document.getElementById('message-area');
        const scratchModal = document.getElementById('scratch-modal');
        
        // --- NOVOS ELEMENTOS DE DEPÓSITO ---
        const depositOptions = document.querySelector('.deposit-options');
        const customDepositInput = document.getElementById('custom-deposit-input');
        const customDepositBtn = document.getElementById('custom-deposit-btn');

        let balance = 1000;
        const costToPlay = 50;
        const weightedPrizes = [ { value: 0, weight: 45 }, { value: 10, weight: 20 }, { value: 25, weight: 15 }, { value: 75, weight: 10 }, { value: 150, weight: 8 }, { value: 500, weight: 2 } ];
        let prizePool = [];
        weightedPrizes.forEach(p => { for (let i = 0; i < p.weight; i++) prizePool.push(p.value); });
        
        let inventory = [];
        let isRevealingAll = false;

        // --- NOVA FUNÇÃO DE DEPÓSITO ---
        function addFunds(amount) {
            const value = parseInt(amount);
            if (isNaN(value) || value <= 0) {
                messageArea.textContent = "Por favor, insira um valor válido.";
                return;
            }
            
            balance += value;
            messageArea.textContent = `R$ ${value} adicionados com sucesso!`;
            updateBalanceDisplay();
            updatePurchaseButton();
            // Limpa o campo de input customizado
            if (customDepositInput.value) customDepositInput.value = '';
        }

        function updateBalanceDisplay() {
            balanceDisplay.textContent = `Saldo: R$ ${balance}`;
        }

        function updatePurchaseButton() {
            const quantity = parseInt(quantityInput.value);
            if (isNaN(quantity) || quantity < 1) return;
            const totalCost = quantity * costToPlay;
            buyButton.textContent = `Comprar ${quantity} (${'R$ ' + totalCost})`;
            buyButton.disabled = totalCost > balance || isRevealingAll;
        }

        function buyCards() {
            const quantity = parseInt(quantityInput.value);
            const totalCost = quantity * costToPlay;
            if (totalCost > balance) { messageArea.textContent = "Saldo insuficiente!"; return; }
            balance -= totalCost;
            updateBalanceDisplay();
            messageArea.textContent = `${quantity} raspadinha(s) comprada(s)!`;
            for (let i = 0; i < quantity; i++) {
                inventory.push({ id: Date.now() + i, prize: prizePool[Math.floor(Math.random() * prizePool.length)] });
            }
            renderInventory();
            updatePurchaseButton();
        }

        function renderInventory() {
            inventoryArea.innerHTML = '';
            inventory.forEach((card, index) => {
                const cardEl = document.createElement('div');
                cardEl.className = 'inventory-card';
                cardEl.dataset.index = index;
                cardEl.innerHTML = `
                    <div class="card-face card-front">?</div>
                    <div class="card-face card-back ${card.prize > 0 ? 'win' : 'lose'}">R$ ${card.prize}</div>
                `;
                // REMOVIDO o modal de raspar um por um para simplificar o fluxo.
                // Agora o clique revela a carta diretamente no inventário.
                cardEl.addEventListener('click', () => revealSingleCard(cardEl, index));
                inventoryArea.appendChild(cardEl);
            });
            revealAllBtn.style.display = inventory.length > 0 ? 'inline-block' : 'none';
        }

        function revealSingleCard(cardEl, index) {
            if (cardEl.classList.contains('is-revealing') || isRevealingAll) return;

            const cardData = inventory[index];
            if (!cardData) return; // Se já foi removido

            cardEl.classList.add('is-revealing');

            setTimeout(() => {
                balance += cardData.prize;
                updateBalanceDisplay();
                messageArea.textContent = `Você ganhou R$ ${cardData.prize}!`;
                
                // Marca o item como "removido" para não ser re-processado
                const originalIndex = inventory.findIndex(item => item.id === cardData.id);
                if (originalIndex > -1) inventory.splice(originalIndex, 1);
                
                updatePurchaseButton();
                revealAllBtn.style.display = inventory.length > 0 ? 'inline-block' : 'none';
            }, 600); // 600ms = duração da animação de virar
        }

        async function revealAllCards() {
            if (isRevealingAll || inventory.length === 0) return;
            isRevealingAll = true;
            updatePurchaseButton();
            revealAllBtn.disabled = true;

            let totalWinnings = 0;
            const cardElements = document.querySelectorAll('.inventory-card:not(.is-revealing)');
            
            for (let i = 0; i < cardElements.length; i++) {
                await new Promise(resolve => setTimeout(resolve, 100));
                cardElements[i].classList.add('is-revealing');
                totalWinnings += inventory[i].prize;
            }
            
            await new Promise(resolve => setTimeout(resolve, 1000));
            balance += totalWinnings;
            inventory = [];
            messageArea.textContent = `Você ganhou um total de R$ ${totalWinnings}!`;
            updateBalanceDisplay();
            renderInventory();
            isRevealingAll = false;
            updatePurchaseButton();
            revealAllBtn.disabled = false;
        }

        // --- EVENT LISTENERS ---
        plusBtn.addEventListener('click', () => { quantityInput.value++; updatePurchaseButton(); });
        minusBtn.addEventListener('click', () => { if (quantityInput.value > 1) quantityInput.value--; updatePurchaseButton(); });
        quantityInput.addEventListener('input', updatePurchaseButton);
        buyButton.addEventListener('click', buyCards);
        revealAllBtn.addEventListener('click', revealAllCards);

        // --- NOVOS LISTENERS DE DEPÓSITO ---
        depositOptions.addEventListener('click', (e) => {
            if (e.target.matches('.btn[data-amount]')) {
                addFunds(e.target.dataset.amount);
            }
        });
        customDepositBtn.addEventListener('click', () => {
            addFunds(customDepositInput.value);
        });

        // --- INICIALIZAÇÃO ---
        updateBalanceDisplay();
        updatePurchaseButton();
    });
    </script>
</body>
</html>
