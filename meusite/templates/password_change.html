{% extends 'base.html' %}
{% block title %}Alterar Senha{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-4">
        <h3 class="text-center mb-4">Alterar Senha</h3>
        <form method="post">
            {% csrf_token %}
            <div class="mb-3">
                <label for="old_password" class="form-label">Senha Atual</label>
                <input type="password" class="form-control" id="old_password" name="old_password" required>
            </div>
            <div class="mb-3">
                <label for="new_password1" class="form-label">Nova Senha</label>
                <input type="password" class="form-control" id="new_password1" name="new_password1" required>
            </div>
            <div class="mb-3">
                <label for="new_password2" class="form-label">Confirme a Nova Senha</label>
                <input type="password" class="form-control" id="new_password2" name="new_password2" required>
            </div>
            <button type="submit" class="btn btn-warning w-100">Alterar</button>
        </form>
    </div>
</div>
{% endblock %}
