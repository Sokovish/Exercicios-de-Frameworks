{% extends 'base.html' %}
{% block title %}Perfil{% endblock %}
{% block content %}
<div class="container mt-5">
    {% if messages %}
        {% for message in messages %}
            <div class="alert alert-{{ message.tags }}">{{ message }}</div>
        {% endfor %}
    {% endif %}
    <h3>Perfil</h3>
    <ul class="list-group">
        <li class="list-group-item"><strong>Usuário:</strong> {{ user.username }}</li>
        <li class="list-group-item"><strong>Email:</strong> {{ user.email }}</li>
    </ul>
    <a href="{% url 'password_change' %}" class="btn btn-warning mt-3">Alterar senha</a>
    <a href="{% url 'logout' %}" class="btn btn-danger mt-3">Logout</a>
    <a href="{% url 'home' %}" class="btn btn-outline-primary mt-3"><i class="bi bi-arrow-left"></i> Voltar para o painel</a>
</div>
{% endblock %}
