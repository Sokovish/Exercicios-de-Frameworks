<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Página de Vendas - Vue.js</title>
    <script src="https://cdn.jsdelivr.net/npm/vue@2"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(120deg, #f8fafc 0%, #e0e7ff 100%);
        }
        .card-product {
            transition: box-shadow 0.2s;
        }
        .card-product:hover {
            box-shadow: 0 4px 16px rgba(0,0,0,0.12);
        }
        .cart-list {
            max-height: 250px;
            overflow-y: auto;
        }
    </style>
</head>
<body>
<div id="app" class="container py-5">
    <div class="row mb-4">
        <div class="col-md-8">
            <h2 class="mb-3"><i class="bi bi-bag"></i> Produtos à venda</h2>
            <div class="row g-4">
                <div class="col-md-6 col-lg-4" v-for="produto in produtos" :key="produto.id">
                    <div class="card card-product h-100">
                        <div class="card-body d-flex flex-column justify-content-between">
                            <div>
                                <h5 class="card-title">{{ produto.nome }}</h5>
                                <p class="card-text text-secondary">R$ {{ produto.valor.toFixed(2) }}</p>
                            </div>
                            <button class="btn btn-success mt-2"
                                    v-on:click="adicionarCarrinho(produto)"
                                    v-bind:disabled="carrinho.includes(produto)">
                                <i class="bi bi-cart-plus"></i> Adicionar ao carrinho
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card shadow-sm">
                <div class="card-header bg-primary text-white">
                    <i class="bi bi-cart"></i> Carrinho
                </div>
                <div class="card-body cart-list">
                    <ul class="list-group mb-2" v-show="carrinho.length > 0">
                        <li class="list-group-item d-flex justify-content-between align-items-center" v-for="item in carrinho" :key="item.id">
                            <span>{{ item.nome }}</span>
                            <span class="badge bg-secondary">R$ {{ item.valor.toFixed(2) }}</span>
                        </li>
                    </ul>
                    <div v-if="carrinho.length === 0" class="text-muted text-center">
                        <i class="bi bi-cart-x"></i> Carrinho vazio
                    </div>
                </div>
                <div class="card-footer">
                    <div v-if="carrinho.length > 0">
                        <div class="mb-2">
                            <strong>Total:</strong> R$ {{ totalCarrinho.toFixed(2) }}
                        </div>
                        <button class="btn btn-primary w-100">
                            <i class="bi bi-credit-card"></i> Ir para pagamento
                        </button>
                    </div>
                    <div v-else>
                        <small class="text-muted">Adicione produtos ao carrinho para pagar.</small>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<script>
new Vue({
    el: '#app',
    data: {
        produtos: [
            {id: 1, nome: 'Notebook Gamer', valor: 3500.00},
            {id: 2, nome: 'Mouse RGB', valor: 150.00},
            {id: 3, nome: 'Teclado Mecânico', valor: 250.00},
            {id: 4, nome: 'Monitor 24"', valor: 900.00},
            {id: 5, nome: 'Headset', valor: 180.00},
            {id: 6, nome: 'Webcam HD', valor: 120.00}
        ],
        carrinho: []
    },
    methods: {
        adicionarCarrinho(produto) {
            if (!this.carrinho.includes(produto)) {
                this.carrinho.push(produto);
            }
        }
    },
    computed: {
        totalCarrinho() {
            return this.carrinho.reduce((total, item) => total + item.valor, 0);
        }
    }
});
</script>
</body>
</html>
